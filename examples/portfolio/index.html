<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="创作玩家单页作品集教程的本地示例">
  <title>小满｜个人创作作品集示例</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#intro">小满<span>作品集示例</span></a>
    <nav aria-label="页面导航">
      <a href="#work">作品</a>
      <a href="#contact">联系</a>
    </nav>
  </header>
  <main>
    <section class="intro" id="intro">
      <p class="eyebrow">图像 · 音乐 · 视频</p>
      <h1>把日常做成作品。</h1>
      <p class="introduction">你好，我是小满。这里展示三种练习题材，以及怎样把它们整理成一页作品集。</p>
      <a class="button" href="#work">浏览作品 <span aria-hidden="true">↘</span></a>
    </section>
    <section class="work" id="work">
      <h2>精选作品</h2>
      <div class="cards">
        <article>
          <img src="images/comic.jpg" alt="黄伞下排列着几只纸船">
          <div class="card-text"><p>短剧分镜</p><h3>伞下的纸船</h3><p>把一个雨天反转拆成六个镜头。</p></div>
        </article>
        <article>
          <img src="images/song.jpg" alt="傍晚车站外暖光下的人影">
          <div class="card-text"><p>歌曲创作</p><h3>晚风来信</h3><p>从一段副歌写出歌曲小样的方案。</p></div>
        </article>
        <article>
          <img src="images/timeline.png" alt="30 秒教程的三段镜头时间表">
          <div class="card-text"><p>短视频</p><h3>30 秒教程镜头表</h3><p>把一段口播拆成三个画面。</p></div>
        </article>
      </div>
    </section>
    <section class="contact" id="contact">
      <h2>联系</h2>
      <p>示例站点。上线前请替换为自己的联系信息。</p>
    </section>
  </main>
  <footer>创作玩家 · 本地作品集练习</footer>
</body>
</html>
